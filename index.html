<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共有レシピ帳</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">

  <!-- Dynamic PWA Manifest -->
  <link id="manifest-link" rel="manifest" href="">

  <style>
    :root {
      --primary: #E05638;
      --primary-hover: #C84326;
      --primary-light: #FDF2F0;
      --accent: #F97316;
      --star-color: #F59E0B;
      --bg: #FAFAF9;
      --surface: #FFFFFF;
      --border: #E7E5E4;
      --border-dark: #D6D3D1;
      --text: #1C1917;
      --text-muted: #78716C;
      --text-light: #A8A29E;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.12), 0 8px 10px -6px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.92);
    }
    .header-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--primary);
      text-decoration: none;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Google Auth Header UI */
    .user-auth-wrapper {
      display: flex;
      align-items: center;
    }
    .btn-google-login {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .btn-google-login:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      padding: 3px 8px 3px 3px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
    }
    .user-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-name {
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.05rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* Navigation Bar */
    nav {
      max-width: 680px;
      margin: 1rem auto 0;
      padding: 0 1rem;
      display: flex;
      gap: 8px;
    }
    .nav-tab {
      flex: 1;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .nav-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(224, 86, 56, 0.3);
    }

    /* Main Container */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1rem;
    }

    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Controls (Search & Filter) */
    .search-filter-box {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .search-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 52px !important;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(224, 86, 56, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-light);
      pointer-events: none;
      z-index: 5;
    }
    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .category-pills::-webkit-scrollbar { display: none; }
    .pill {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pill.active {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }
    .pill.pill-fav {
      border-color: #FCD34D;
      color: #92400E;
      background: #FEF3C7;
    }
    .pill.pill-fav.active {
      background: #F59E0B;
      color: white;
      border-color: #F59E0B;
    }

    /* Recipe Grid & Cards */
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .recipe-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .recipe-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .card-img-wrapper {
      width: 100%;
      height: 160px;
      background: #F3F4F6;
      position: relative;
      overflow: hidden;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #D1D5DB;
      background: linear-gradient(135deg, #FEF3C7, #FFEDD5);
    }
    .card-category-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
    .card-fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.88);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 6;
    }
    .card-fav-btn:hover {
      transform: scale(1.1);
      background: white;
    }
    .card-photo-count-tag {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }
    .card-content {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: var(--text);
      line-height: 1.4;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .card-ingredients-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    /* Form Styles */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.2rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
    }
    .form-section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--primary-light);
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    .form-group:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .field-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: -4px;
      margin-bottom: 6px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(224, 86, 56, 0.15);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
    }

    /* Multi Photo Picker Grid in Form */
    .photos-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 6px;
    }
    .photo-thumb-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .photo-thumb-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .btn-remove-thumb {
      position: absolute;
      top: 4px; right: 4px;
      background: rgba(0,0,0,0.75);
      color: white;
      border: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      z-index: 2;
    }
    .btn-remove-thumb:hover { background: #EF4444; }
    .add-photo-box {
      border: 2px dashed var(--border-dark);
      border-radius: var(--radius-sm);
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }
    .add-photo-box:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(224, 86, 56, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(224, 86, 56, 0.35);
    }
    .btn:disabled {
      background: var(--border-dark);
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-danger {
      background: #EF4444;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.25);
    }
    .btn-danger:hover {
      background: #DC2626;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
    }
    .btn-secondary {
      background: #F3F4F6;
      color: var(--text);
      box-shadow: none;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #E5E7EB;
    }

    /* Modal Overlay & Dialog */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      transform: scale(0.95);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .modal-backdrop.active .modal-card {
      transform: scale(1);
    }
    .modal-header {
      padding: 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
    }
    .modal-title-group { flex: 1; padding-right: 12px; }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }
    .modal-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .modal-close-btn {
      background: #F3F4F6;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-muted);
    }
    .modal-close-btn:hover { background: #E5E7EB; color: var(--text); }
    .modal-body {
      padding: 1.2rem;
      overflow-y: auto;
    }

    /* Detail Photo Gallery */
    .detail-gallery-container {
      width: 100%;
      background: #18181B;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1.2rem;
      position: relative;
    }
    .detail-main-img-wrapper {
      width: 100%;
      min-height: 240px;
      max-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #09090B;
    }
    .detail-main-img {
      max-width: 100%;
      max-height: 420px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 5;
      transition: background 0.2s ease;
    }
    .gallery-nav-btn:hover { background: rgba(0,0,0,0.9); }
    .gallery-nav-btn.prev { left: 10px; }
    .gallery-nav-btn.next { right: 10px; }

    .gallery-thumbs-row {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #27272A;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .gallery-thumbs-row::-webkit-scrollbar { display: none; }
    .gallery-thumb-item {
      width: 54px;
      height: 54px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.5;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .gallery-thumb-item.active {
      opacity: 1;
      border-color: var(--primary);
    }

    .detail-section {
      margin-bottom: 1.4rem;
    }
    .detail-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0 0 0.6rem 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Ingredient Checklist */
    .ingredient-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg);
      padding: 0.8rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    .ingredient-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }
    .ingredient-item:hover { background: rgba(0,0,0,0.03); }
    .ingredient-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .ingredient-item.checked span {
      text-decoration: line-through;
      color: var(--text-light);
    }

    /* Step List */
    .step-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .step-item {
      display: flex;
      gap: 12px;
      background: var(--surface);
      padding: 0.8rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    .step-number {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .step-text {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text);
      align-self: center;
    }

    .notes-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      color: #92400E;
      white-space: pre-wrap;
    }

    .modal-footer {
      padding: 1rem 1.2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border-bottom-left-radius: var(--radius-lg);
      border-bottom-right-radius: var(--radius-lg);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-dark);
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="#" class="app-logo">
        <span>🍳</span>
        <span>共有レシピ帳</span>
      </a>
      <div class="header-actions">
        <!-- Google Auth Profile / Login Button -->
        <div class="user-auth-wrapper">
          <button id="btn-google-login" class="btn-google-login">

  <!-- PWA マニフェスト -->
  <script>
    const manifest = {

  <!-- App Main JavaScript Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      deleteDoc, 
      doc, 
      setDoc,
      getDoc,
      updateDoc, 
      arrayUnion,
      arrayRemove,
      orderBy, 
      query, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // --- State Variables ---
    let app = null;
    let db = null;
    let auth = null;
    let currentUser = null;
    let userFavorites = [];
    let recipesCache = [];
    let activeCategory = 'all';
    let searchQuery = '';
    let selectedImagesBase64 = [];
    let currentDetailRecipe = null;
    let currentGalleryIndex = 0;
    let editingRecipeId = null;

    const googleAuthProvider = new GoogleAuthProvider();

    // --- Cloud Firebase Personal Favorites Logic ---
    async function loadUserFavorites() {
      if (!currentUser || !db) {
        userFavorites = [];
        renderRecipeList();
        return;
      }
      try {
        const userDocRef = doc(db, "users", currentUser.uid);
        const snap = await getDoc(userDocRef);
        if (snap.exists()) {
          userFavorites = snap.data().favorites || [];
        } else {
          userFavorites = [];
          await setDoc(userDocRef, { favorites: [], updatedAt: serverTimestamp() });
        }
      } catch (e) {
        console.error("User favorites load error:", e);
        userFavorites = [];
      }
      renderRecipeList();
    }

    function isFavorite(recipeId) {
      return userFavorites.includes(recipeId);
    }

    async function toggleFavorite(recipeId) {
      if (!currentUser) {
        if (confirm("お気に入り機能を利用するにはGoogleログインが必要です。\nGoogleでログインしますか？")) {
          loginWithGoogle();
        }
        return;
      }

      const userDocRef = doc(db, "users", currentUser.uid);
      const isFav = userFavorites.includes(recipeId);

      if (isFav) {
        userFavorites = userFavorites.filter(id => id !== recipeId);
        try {
          await updateDoc(userDocRef, { favorites: arrayRemove(recipeId) });
        } catch {
          await setDoc(userDocRef, { favorites: userFavorites }, { merge: true });
        }
      } else {
        userFavorites.push(recipeId);
        try {
          await updateDoc(userDocRef, { favorites: arrayUnion(recipeId) });
        } catch {
          await setDoc(userDocRef, { favorites: userFavorites }, { merge: true });
        }
      }

      renderRecipeList();
      if (currentDetailRecipe && currentDetailRecipe.id === recipeId) {
        updateDetailFavStar();
      }
    }

    // --- Google Auth Login & UI ---
    async function loginWithGoogle() {
      if (!app || !auth) {
        modalSettings.classList.add('active');
        return alert("先にFirebaseの接続情報を設定してください。");
      }
      try {
        const result = await signInWithPopup(auth, googleAuthProvider);
        currentUser = result.user;
        updateUserHeaderUI();
        await loadUserFavorites();
      } catch (e) {
        console.error("Google Auth error:", e);
        alert("Googleログインに失敗しました: " + e.message);
      }
    }

    async function logoutUser() {
      if (auth) {
        await signOut(auth);
        currentUser = null;
        updateUserHeaderUI();
        loadUserFavorites();
      }
    }

    function updateUserHeaderUI() {
      const btnLogin = document.getElementById('btn-google-login');
      const badge = document.getElementById('user-profile-badge');
      const avatar = document.getElementById('user-avatar');
      const name = document.getElementById('user-name');

      if (currentUser) {
        btnLogin.style.display = 'none';
        badge.style.display = 'flex';
        avatar.src = currentUser.photoURL || 'https://via.placeholder.com/28';
        name.innerText = currentUser.displayName || 'ユーザー';
      } else {
        btnLogin.style.display = 'flex';
        badge.style.display = 'none';
      }
    }

    document.getElementById('btn-google-login').addEventListener('click', loginWithGoogle);
    document.getElementById('btn-logout').addEventListener('click', logoutUser);

    // --- Page & Modal DOM Elements ---
    const pages = {
      list: document.getElementById('page-list'),
      add: document.getElementById('page-add')
    };
    const navButtons = {
      list: document.getElementById('nav-list'),
      add: document.getElementById('nav-add')
    };
    const modalSettings = document.getElementById('modal-settings');
    const modalDetail = document.getElementById('modal-recipe-detail');

    // --- Navigation Logic ---
    function switchPage(pageName) {
      Object.values(pages).forEach(p => p.classList.remove('active'));
      Object.values(navButtons).forEach(b => b.classList.remove('active'));
      pages[pageName].classList.add('active');
      navButtons[pageName].classList.add('active');
      
      if (pageName === 'add' && !editingRecipeId) {
        resetForm();
      }

      if (pageName === 'list' && app) fetchRecipes();
    }

    navButtons.list.addEventListener('click', () => {
      editingRecipeId = null;
      switchPage('list');
    });
    navButtons.add.addEventListener('click', () => {
      if (!editingRecipeId) resetForm();
      switchPage('add');
    });

    // --- Form Multiple Photo Picker UI Logic ---
    const fileInput = document.getElementById('recipe-images-input');
    const btnAddPhotos = document.getElementById('btn-add-photos');
    const photosPreviewGrid = document.getElementById('photos-preview-grid');

    btnAddPhotos.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      for (const file of files) {
        try {
          const b64 = await compressImage(file);
          selectedImagesBase64.push(b64);
        } catch (err) {
          alert(err.message);
        }
      }
      fileInput.value = '';
      renderFormPhotoPreviews();
    });

    function renderFormPhotoPreviews() {
      const existingThumbs = photosPreviewGrid.querySelectorAll('.photo-thumb-wrapper');
      existingThumbs.forEach(t => t.remove());

      selectedImagesBase64.forEach((b64, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'photo-thumb-wrapper';
        wrap.innerHTML = `
          <img src="${b64}" class="photo-thumb-img" alt="写真">
          <button class="btn-remove-thumb" title="削除">✕</button>
        `;
        wrap.querySelector('.btn-remove-thumb').addEventListener('click', (e) => {
          e.stopPropagation();
          selectedImagesBase64.splice(idx, 1);
          renderFormPhotoPreviews();
        });
        photosPreviewGrid.insertBefore(wrap, btnAddPhotos);
      });
    }

    // Reset Form UI
    function resetForm() {
      editingRecipeId = null;
      selectedImagesBase64 = [];
      document.getElementById('recipe-title').value = '';
      document.getElementById('recipe-category').value = '主菜';
      document.getElementById('recipe-servings').value = '';
      document.getElementById('recipe-ingredients').value = '';
      document.getElementById('recipe-steps').value = '';
      document.getElementById('recipe-memo').value = '';
      renderFormPhotoPreviews();

      document.getElementById('form-header-title').innerText = '📌 基本情報';
      document.getElementById('nav-add-icon').innerText = '➕';
      document.getElementById('nav-add-text').innerText = 'レシピ登録';
      document.getElementById('btn-save-content').innerHTML = `<span>💾</span> レシピを保存する`;
    }

    // --- Settings Modal Logic ---
    document.getElementById('btn-open-settings').addEventListener('click', () => {
      modalSettings.classList.add('active');
    });
    document.getElementById('btn-close-settings').addEventListener('click', () => {
      modalSettings.classList.remove('active');
    });

    // --- Detail Modal Close ---
    document.getElementById('btn-close-detail').addEventListener('click', () => {
      modalDetail.classList.remove('active');
      currentDetailRecipe = null;
    });

    // Close modal when clicking backdrop
    [modalSettings, modalDetail].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
          currentDetailRecipe = null;
        }
      });
    });

    // --- Image Compression Logic ---
    function compressImage(file, maxWidth = 900, maxHeight = 900, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxHeight) {
              if (width > height) {
                height = Math.round(height * (maxWidth / width));
                width = maxWidth;
              } else {
                width = Math.round(width * (maxHeight / height));
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const base64 = canvas.toDataURL('image/jpeg', quality);
            if (base64.length * 0.75 > 900000) {
              reject(new Error("画像サイズが大きすぎます。別の画像を選ぶか、解像度を下げてください。"));
            } else {
              resolve(base64);
            }
          };
          img.onerror = () => reject(new Error("画像の読込に失敗しました。"));
        };
        reader.onerror = () => reject(new Error("ファイルの読込に失敗しました。"));
      });
    }

    // --- Firebase & Auth Initialization ---
    function initFirebase(configStr) {
      try {
        const config = JSON.parse(configStr);
        app = initializeApp(config);
        db = getFirestore(app);
        auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
          currentUser = user;
          updateUserHeaderUI();
          loadUserFavorites();
        });

        return true;
      } catch (e) {
        alert("Firebase設定JSONのフォーマットが正しくありません。");
        return false;
      }
    }

    const savedConfig = localStorage.getItem('fbConfig');
    if (savedConfig) {
      document.getElementById('firebase-config-json').value = savedConfig;
      if (initFirebase(savedConfig)) fetchRecipes();
    } else {
      modalSettings.classList.add('active');
    }

    document.getElementById('btn-save-settings').addEventListener('click', () => {
      const configStr = document.getElementById('firebase-config-json').value;
      if (initFirebase(configStr)) {
        localStorage.setItem('fbConfig', configStr);
        modalSettings.classList.remove('active');
        alert("Firebase設定を保存しました！");
        fetchRecipes();
      }
    });

    // --- Save / Update Recipe ---
    document.getElementById('btn-save-recipe').addEventListener('click', async () => {
      if (!app) {
        modalSettings.classList.add('active');
        return alert("先にFirebaseの接続情報を設定してください。");
      }

      const title = document.getElementById('recipe-title').value.trim();
      const category = document.getElementById('recipe-category').value;
      const servings = document.getElementById('recipe-servings').value;
      const rawIngredients = document.getElementById('recipe-ingredients').value;
      const rawSteps = document.getElementById('recipe-steps').value;
      const memo = document.getElementById('recipe-memo').value.trim();
      const btnSave = document.getElementById('btn-save-recipe');

      if (!title) return alert("料理名は必須項目です！");

      const ingredients = rawIngredients
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);

      const steps = rawSteps
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);

      const btnSaveContent = document.getElementById('btn-save-content');
      btnSaveContent.innerHTML = `<span>⏳</span> 保存中...`;
      btnSave.disabled = true;

      try {
        const recipeData = {
          title,
          category: category || "その他",
          servings: servings || "",
          ingredients,
          steps,
          memo,
          imageUrls: selectedImagesBase64,
          imageUrl: selectedImagesBase64[0] || "",
          createdBy: currentUser ? currentUser.displayName || currentUser.email : "匿名"
        };

        if (editingRecipeId) {
          await updateDoc(doc(db, "recipes", editingRecipeId), recipeData);
          alert("レシピを更新しました！");
        } else {
          recipeData.createdAt = serverTimestamp();
          await addDoc(collection(db, "recipes"), recipeData);
          alert("レシピを保存しました！");
        }

        resetForm();
        switchPage('list');
      } catch (e) {
        console.error(e);
        alert("エラーが発生しました: " + e.message);
      } finally {
        const isEdit = !!editingRecipeId;
        btnSaveContent.innerHTML = `<span>💾</span> ${isEdit ? 'レシピを更新する' : 'レシピを保存する'}`;
        btnSave.disabled = false;
      }
    });

    // --- Fetch Recipes & Render List ---
    async function fetchRecipes() {
      const container = document.getElementById('recipe-list-container');
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔄</div><p>レシピを読み込み中...</p></div>`;

      try {
        const q = query(collection(db, "recipes"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        recipesCache = [];
        querySnapshot.forEach((docSnap) => {
          recipesCache.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        renderRecipeList();
      } catch (e) {
        console.error(e);
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>データの取得に失敗しました。設定情報を確認してください。</p></div>`;
      }
    }

    // --- 超強力な Google風 漢字・音訓・形態音韻ファジーエンジン ---

    const KANJI_READING_MAP = {
      '合': 'アイ', '挽': 'ヒキ', '肉': 'ニク', '豚': 'ブタ', '牛': 'ギュウ',
      '鶏': 'トリ', '鳥': 'トリ', '魚': 'サカナ', '鮭': 'サケ', '鮪': 'マグロ',
      '鯖': 'サバ', '鯛': 'タイ', '蝦': 'エビ', '海老': 'エビ', '蟹': 'カニ',
      '蛸': 'タコ', '烏': 'イカ', '玉': 'タマ', '葱': 'ネギ', '根': 'ネ',
      '人': 'ニン', '参': 'ジン', '大': 'ダイ', '瓜': 'ウリ', '茄': 'ナス',
      '子': 'コ', '芋': 'イモ', '茸': 'キノコ', '筍': 'タケノコ', '菜': 'サイ',
      '葉': 'ハ', '花': 'ハナ', '実': 'ミ', '種': 'タネ', '油': 'アブラ',
      '塩': 'シオ', '糖': 'トウ', '酢': 'ス', '酒': 'サケ', '汁': 'シル',
      '湯': 'ユ', '出': 'ダシ', '米': 'コメ', '飯': 'ハン', '麦': 'ムギ',
      '粉': 'コナ', '面': 'メン', '麺': 'メン', '餅': 'モチ', '乳': 'ニュウ',
      '卵': 'タマゴ', '豆': 'マメ', '腐': 'フ', '芽': 'メ', '焼': 'ヤキ',
      '炒': 'イタメ', '煮': 'ニ', '蒸': 'ムシ', '揚': 'アゲ', '切': 'キリ',
      '盛': 'モリ', '生': 'ナマ', '干': 'ホシ', '漬': 'ツケ', '味': 'アジ',
      '香': 'カオ', '辛': 'カラ', '甘': 'アマ', '酸': 'ス', '苦': 'ニガ',
      '旨': 'ウマ', '濃': 'コイ', '薄': 'ウス', '風': 'フウ'
    };

    function removeDakuon(str) {
      if (!str) return '';
      const dakuonMap = {
        'ガ':'カ','ギ':'キ','グ':'ク','ゲ':'ケ','ゴ':'コ',
        'ザ':'サ','ジ':'シ','ズ':'ス','ゼ':'セ','ゾ':'ソ',
        'ダ':'タ','ヂ':'チ','ヅ':'ツ','デ':'テ','ド':'ト',
        'バ':'ハ','ビ':'ヒ','ブ':'フ','ベ':'ヘ','ボ':'ホ',
        'パ':'ハ','ピ':'ヒ','プ':'フ','ペ':'ヘ','ポ':'ホ','ヴ':'ウ',
        'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ',
        'ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
        'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と',
        'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
        'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ'
      };
      return str.replace(/[ガ-ポが-ほヴ]/g, m => dakuonMap[m] || m);
    }

    function toPhoneticKatakana(str) {
      if (!str) return '';
      let s = String(str).toLowerCase();
      s = s.replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0));
      s = s.replace(/[\s\u3000・,\-_\/\\\(\)\u3001\u3002]/g, '');
      
      let res = '';
      for (let ch of s) {
        res += KANJI_READING_MAP[ch] || ch;
      }
      res = res.replace(/[\u3041-\u3096]/g, match => String.fromCharCode(match.charCodeAt(0) + 0x60));
      res = res.replace(/[ーッっ]/g, '');
      return res;
    }

    function getLcsLength(s1, s2) {
      const m = s1.length;
      const n = s2.length;
      if (m === 0 || n === 0) return 0;
      const dp = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (s1[i - 1] === s2[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }
      return dp[m][n];
    }

    function calculateGoogleFuzzyScore(queryWord, targetText) {
      if (!queryWord || !targetText) return 0;

      const normQ = toPhoneticKatakana(queryWord);
      const normT = toPhoneticKatakana(targetText);

      if (normQ.length === 0 || normT.length === 0) return 0;

      if (normT.includes(normQ)) return 3.5;

      const dakuonQ = removeDakuon(normQ);
      const dakuonT = removeDakuon(normT);
      if (dakuonT.includes(dakuonQ)) return 3.0;

      const maxLcs = Math.max(getLcsLength(normQ, normT), getLcsLength(dakuonQ, dakuonT));
      const lcsRatio = maxLcs / normQ.length;
      if (lcsRatio >= 0.7) return 2.2 * lcsRatio;

      if (normQ.length >= 2) {
        let matchPairCount = 0;
        for (let i = 0; i < normQ.length - 1; i++) {
          if (normT.includes(normQ.slice(i, i + 2)) || dakuonT.includes(dakuonQ.slice(i, i + 2))) {
            matchPairCount++;
          }
        }
        const bigramRatio = matchPairCount / (normQ.length - 1);
        if (bigramRatio >= 0.4) return 1.5 * bigramRatio;
      }
      return 0;
    }

    function computeRecipeSemanticScore(recipe, queryStr) {
      const keywords = queryStr.trim().split(/\s+/).filter(k => k.length > 0);
      if (keywords.length === 0) return 1.0;
      let totalScore = 0;

      for (const kw of keywords) {
        let kwMaxScore = calculateGoogleFuzzyScore(kw, recipe.title) * 1.5;
        if (Array.isArray(recipe.ingredients)) {
          for (const ing of recipe.ingredients) {
            kwMaxScore = Math.max(kwMaxScore, calculateGoogleFuzzyScore(kw, ing) * 1.2);
          }
        }
        if (recipe.memo) {
          kwMaxScore = Math.max(kwMaxScore, calculateGoogleFuzzyScore(kw, recipe.memo) * 0.9);
        }
        if (kwMaxScore < 0.4) return 0;
        totalScore += kwMaxScore;
      }
      return totalScore;
    }

    // Filter & Render List
    function renderRecipeList() {
      const container = document.getElementById('recipe-list-container');

      const scoredRecipes = recipesCache.map(item => {
        let categoryMatch = false;
        if (activeCategory === 'all') {
          categoryMatch = true;
        } else if (activeCategory === 'fav') {
          categoryMatch = isFavorite(item.id);
        } else {
          categoryMatch = ((item.category || 'その他') === activeCategory);
        }

        let score = categoryMatch ? computeRecipeSemanticScore(item, searchQuery) : 0;
        return { item, score };
      }).filter(res => res.score > 0);

      scoredRecipes.sort((a, b) => b.score - a.score);

      const filtered = scoredRecipes.map(res => res.item);

      if (filtered.length === 0) {
        const msg = activeCategory === 'fav' 
          ? (currentUser ? 'お気に入りに登録されたレシピがありません。カードの ⭐ ボタンで追加できます。' : 'Googleログインするとお気に入り機能が利用できます。')
          : '該当するレシピが見つかりません。';
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🍽️</div>
            <p>${msg}</p>
          </div>`;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'recipe-grid';

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.addEventListener('click', () => openRecipeDetail(item));

        const photos = getRecipePhotos(item);
        const coverPhoto = photos[0] || "";

        const imageHtml = coverPhoto
          ? `<img src="${coverPhoto}" alt="${item.title}" class="card-img">`
          : `<div class="card-placeholder">🍳</div>`;

        const categoryTag = item.category ? `<div class="card-category-tag">${item.category}</div>` : '';
        const servingsTag = item.servings ? `<span>👤 ${item.servings}</span>` : '';
        const photoCountBadge = photos.length > 1 ? `<div class="card-photo-count-tag">📷 ${photos.length}</div>` : '';

        const faved = isFavorite(item.id);
        const favBtnHtml = `<button class="card-fav-btn" title="お気に入り">${faved ? '⭐' : '☆'}</button>`;

        let ingredientsPreview = '';
        if (Array.isArray(item.ingredients) && item.ingredients.length > 0) {
          ingredientsPreview = `🛒 ${item.ingredients.slice(0, 3).join('・')}${item.ingredients.length > 3 ? '...' : ''}`;
        } else if (item.memo) {
          ingredientsPreview = item.memo;
        }

        card.innerHTML = `
          <div class="card-img-wrapper">
            ${imageHtml}
            ${categoryTag}
            ${favBtnHtml}
            ${photoCountBadge}
          </div>
          <div class="card-content">
            <h3 class="card-title">${escapeHtml(item.title)}</h3>
            <div class="card-meta">
              ${servingsTag}
            </div>
            ${ingredientsPreview ? `<div class="card-ingredients-preview">${escapeHtml(ingredientsPreview)}</div>` : ''}
          </div>
        `;

        card.querySelector('.card-fav-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(item.id);
        });

        grid.appendChild(card);
      });

      container.innerHTML = '';
      container.appendChild(grid);
    }

    // Helper: Extract all photos for a recipe
    function getRecipePhotos(recipe) {
      if (Array.isArray(recipe.imageUrls) && recipe.imageUrls.length > 0) {
        return recipe.imageUrls;
      }
      if (recipe.imageUrl) {
        return [recipe.imageUrl];
      }
      return [];
    }

    // --- Open Detail Modal & Photo Gallery ---
    function openRecipeDetail(recipe) {
      currentDetailRecipe = recipe;
      currentGalleryIndex = 0;

      document.getElementById('detail-title').innerText = recipe.title || '無題';
      document.getElementById('detail-category-badge').innerText = recipe.category || 'その他';

      updateDetailFavStar();

      const servingsEl = document.getElementById('detail-servings');
      if (recipe.servings) {
        servingsEl.innerText = `👤 ${recipe.servings}`;
        servingsEl.style.display = 'inline';
      } else {
        servingsEl.style.display = 'none';
      }

      // Render Photo Gallery
      const photos = getRecipePhotos(recipe);
      const galleryContainer = document.getElementById('detail-gallery-container');
      const btnPrev = document.getElementById('gallery-btn-prev');
      const btnNext = document.getElementById('gallery-btn-next');
      const thumbsRow = document.getElementById('gallery-thumbs-row');

      if (photos.length > 0) {
        galleryContainer.style.display = 'block';
        updateGalleryPhoto(photos);

        if (photos.length > 1) {
          btnPrev.style.display = 'flex';
          btnNext.style.display = 'flex';
          thumbsRow.style.display = 'flex';
          thumbsRow.innerHTML = '';

          photos.forEach((p, idx) => {
            const thumb = document.createElement('img');
            thumb.className = `gallery-thumb-item ${idx === 0 ? 'active' : ''}`;
            thumb.src = p;
            thumb.addEventListener('click', () => {
              currentGalleryIndex = idx;
              updateGalleryPhoto(photos);
            });
            thumbsRow.appendChild(thumb);
          });
        } else {
          btnPrev.style.display = 'none';
          btnNext.style.display = 'none';
          thumbsRow.style.display = 'none';
        }
      } else {
        galleryContainer.style.display = 'none';
      }

      // Ingredients
      const secIngredients = document.getElementById('section-ingredients');
      const listIngredients = document.getElementById('detail-ingredients-list');
      listIngredients.innerHTML = '';

      if (Array.isArray(recipe.ingredients) && recipe.ingredients.length > 0) {
        secIngredients.style.display = 'block';
        recipe.ingredients.forEach(ing => {
          const label = document.createElement('label');
          label.className = 'ingredient-item';
          label.innerHTML = `<input type="checkbox"> <span>${escapeHtml(ing)}</span>`;
          label.querySelector('input').addEventListener('change', (e) => {
            if (e.target.checked) label.classList.add('checked');
            else label.classList.remove('checked');
          });
          listIngredients.appendChild(label);
        });
      } else {
        secIngredients.style.display = 'none';
      }

      // Steps
      const secSteps = document.getElementById('section-steps');
      const listSteps = document.getElementById('detail-steps-list');
      listSteps.innerHTML = '';

      if (Array.isArray(recipe.steps) && recipe.steps.length > 0) {
        secSteps.style.display = 'block';
        recipe.steps.forEach((step, idx) => {
          const item = document.createElement('div');
          item.className = 'step-item';
          item.innerHTML = `
            <div class="step-number">${idx + 1}</div>
            <p class="step-text">${escapeHtml(step)}</p>
          `;
          listSteps.appendChild(item);
        });
      } else {
        secSteps.style.display = 'none';
      }

      // Memo
      const secMemo = document.getElementById('section-memo');
      const contentMemo = document.getElementById('detail-memo-content');
      if (recipe.memo) {
        secMemo.style.display = 'block';
        contentMemo.innerText = recipe.memo;
      } else {
        secMemo.style.display = 'none';
      }

      modalDetail.classList.add('active');
    }

    function updateDetailFavStar() {
      const star = document.getElementById('detail-fav-star');
      if (currentDetailRecipe && isFavorite(currentDetailRecipe.id)) {
        star.innerText = '⭐';
        star.style.color = 'var(--star-color)';
      } else {
        star.innerText = '☆';
        star.style.color = 'var(--text-muted)';
      }
    }

    document.getElementById('btn-toggle-fav-detail').addEventListener('click', () => {
      if (currentDetailRecipe) {
        toggleFavorite(currentDetailRecipe.id);
      }
    });

    function updateGalleryPhoto(photos) {
      const mainImg = document.getElementById('detail-main-img');
      const thumbsRow = document.getElementById('gallery-thumbs-row');
      
      mainImg.src = photos[currentGalleryIndex] || '';

      const thumbs = thumbsRow.querySelectorAll('.gallery-thumb-item');
      thumbs.forEach((t, i) => {
        if (i === currentGalleryIndex) t.classList.add('active');
        else t.classList.remove('active');
      });
    }

    document.getElementById('gallery-btn-prev').addEventListener('click', () => {
      if (!currentDetailRecipe) return;
      const photos = getRecipePhotos(currentDetailRecipe);
      if (photos.length <= 1) return;
      currentGalleryIndex = (currentGalleryIndex - 1 + photos.length) % photos.length;
      updateGalleryPhoto(photos);
    });

    document.getElementById('gallery-btn-next').addEventListener('click', () => {
      if (!currentDetailRecipe) return;
      const photos = getRecipePhotos(currentDetailRecipe);
      if (photos.length <= 1) return;
      currentGalleryIndex = (currentGalleryIndex + 1) % photos.length;
      updateGalleryPhoto(photos);
    });

    // --- Edit Recipe Click Handler ---
    document.getElementById('btn-edit-recipe').addEventListener('click', () => {
      if (!currentDetailRecipe) return;

      editingRecipeId = currentDetailRecipe.id;

      // Populate form
      document.getElementById('recipe-title').value = currentDetailRecipe.title || '';
      document.getElementById('recipe-category').value = currentDetailRecipe.category || '主菜';
      document.getElementById('recipe-servings').value = currentDetailRecipe.servings || '';
      
      document.getElementById('recipe-ingredients').value = Array.isArray(currentDetailRecipe.ingredients)
        ? currentDetailRecipe.ingredients.join('\n')
        : '';
        
      document.getElementById('recipe-steps').value = Array.isArray(currentDetailRecipe.steps)
        ? currentDetailRecipe.steps.join('\n')
        : '';

      document.getElementById('recipe-memo').value = currentDetailRecipe.memo || '';

      selectedImagesBase64 = getRecipePhotos(currentDetailRecipe).slice();
      renderFormPhotoPreviews();

      // Update Form Titles
      document.getElementById('form-header-title').innerText = '✏️ レシピを編集';
      document.getElementById('nav-add-icon').innerText = '✏️';
      document.getElementById('nav-add-text').innerText = 'レシピ編集';
      document.getElementById('btn-save-content').innerHTML = `<span>💾</span> レシピを更新する`;

      // Close modal and switch tab
      modalDetail.classList.remove('active');
      switchPage('add');
    });

    // --- Delete Recipe ---
    document.getElementById('btn-delete-recipe').addEventListener('click', async () => {
      if (!currentDetailRecipe || !db) return;

      if (!confirm("本当にこのレシピを削除しますか？\n削除すると元に戻せません。")) {
        return;
      }

      const btnDelete = document.getElementById('btn-delete-recipe');
      btnDelete.innerText = "削除中...";
      btnDelete.disabled = true;

      try {
        await deleteDoc(doc(db, "recipes", currentDetailRecipe.id));
        modalDetail.classList.remove('active');
        currentDetailRecipe = null;
        alert("レシピを削除しました。");
        fetchRecipes();
      } catch (e) {
        console.error(e);
        alert("削除に失敗しました: " + e.message);
      } finally {
        btnDelete.innerHTML = `<span>🗑️</span> レシピを削除`;
        btnDelete.disabled = false;
      }
    });

    // --- Search & Filter Listeners ---
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderRecipeList();
    });

    document.getElementById('category-pills').addEventListener('click', (e) => {
      if (e.target.classList.contains('pill')) {
        document.querySelectorAll('#category-pills .pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        activeCategory = e.target.dataset.cat;
        renderRecipeList();
      }
    });

    // Helper: HTML Escape
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
